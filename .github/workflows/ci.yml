name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:plugin
      - run: npm run check && npm run format:check && npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --no-default-features --locked
      - run: cargo test -p qqnt-scanner --test filesystem -- --ignored --nocapture
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:plugin
      - run: cargo test --workspace --no-default-features --locked
      - run: npm run desktop:build
      - name: Native embedded frontend and IPC smoke (temporary data)
        timeout-minutes: 5
        run: cargo run -p qqnt-desktop --bin qqnt-desktop-smoke --features desktop,custom-protocol,native-smoke --locked
      - uses: actions/upload-artifact@v4
        with:
          name: qqnt-storage-manager-windows
          path: |
            target/release/qqnt-storage-manager.exe
            target/release/bundle/nsis/*.exe
